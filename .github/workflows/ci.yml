name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dsl:
    name: DSL / CLI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-dsl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge-dsl/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Generate Langium sources
        run: npm run langium:generate

      - name: Build workspaces
        run: npm run build

      - name: Test workspaces
        run: npm test

  runtime:
    name: Java runtime
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bridge-runtime/**/pom.xml
      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress verify

  docker:
    name: Docker images
    needs: runtime
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build worker image
        run: docker build --file bridge-worker/Dockerfile --tag bridge-worker:ci .
      - name: Build orchestrator image
        run: docker build --file bridge-orchestrator/Dockerfile --tag bridge-orchestrator:ci .

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dsl:
    name: DSL / CLI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-dsl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge-dsl/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Generate Langium sources
        run: npm run langium:generate

      - name: Build workspaces
        run: npm run build

      - name: Test workspaces
        run: npm test
      - name: Verify npm package in isolation
        run: npm run test:package --workspace packages/cli

  runtime:
    name: Java runtime
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bridge-runtime/**/pom.xml
      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress verify

  docker:
    name: Docker images
    needs: [runtime, dsl]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build worker image
        run: docker build --file bridge-worker/Dockerfile --tag bridge-worker:ci .
      - name: Build orchestrator image
        run: docker build --file bridge-orchestrator/Dockerfile --tag bridge-orchestrator:ci .
      - name: Set up Node.js for distributed CLI test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge-dsl/package-lock.json
      - name: Build CLI
        working-directory: bridge-dsl
        run: |
          npm ci
          npm run langium:generate
          npm run build
      - name: Test distributed migration through CLI
        working-directory: .
        shell: bash
        run: bash ./scripts/test-cli.sh --workers 2 --check-failure
      - name: Test separate networks and shared AWS profile
        working-directory: .
        shell: bash
        run: bash ./scripts/test-cli.sh --workers 1 --via-host --use-profile
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-e2e-diagnostics
          path: scripts/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

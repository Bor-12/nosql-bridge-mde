
name: Release CLI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'cli-v')

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: bridge-dsl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$RELEASE_TAG" = "cli-v$VERSION"

      - name: Build CLI
        run: |
          npm ci
          npm run langium:generate
          npm run build

      - name: Verify package
        run: npm run test:package --workspace packages/cli

      - name: Publish to npm
        run: |
          npm install -g npm@11.19.1
          npm publish --workspace packages/cli --access public --provenance
